services:
  - type: web
    name: hik-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URI
        sync: false          # set manually in Render dashboard
      - key: DB_NAME
        value: hikdb
      - key: CORS_ORIGINS
        value: https://www.humaniskind.com,https://humaniskind.com,https://hik-frontend.vercel.app
      - key: EVIDENCE_SIGNING_KEY
        generateValue: true
